<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Luciano Rodríguez López, desarrollador frontend">
<style>
.fb{transform-box:fill-box}
.o-l{transform-origin:left center}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

@keyframes gridpan{to{transform:translate(40px,40px)}}
@keyframes floatA{from{transform:translate(0,0)}to{transform:translate(-50px,34px)}}
@keyframes floatB{from{transform:translate(0,0)}to{transform:translate(60px,-26px)}}
@keyframes sweep{0%{transform:translateX(-320px)}55%,100%{transform:translateX(1500px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes bar{0%,100%{transform:scaleX(1)}50%{transform:scaleX(2.2)}}
@keyframes type{0%,4%{transform:scaleX(0)}34%,88%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
@keyframes caret{0%,4%{transform:translateX(0)}34%,88%{transform:translateX(372px)}98%,100%{transform:translateX(0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes grow{0%,6%{transform:scaleX(0)}22%,84%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
@keyframes win{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.grid{animation:gridpan 10s linear infinite}
.orbA{animation:floatA 9s ease-in-out infinite alternate}
.orbB{animation:floatB 11s ease-in-out infinite alternate}
.sweep{animation:sweep 9s ease-in-out infinite}
.r1,.r2,.r3,.r4{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.r1{animation-delay:.1s}.r2{animation-delay:.3s}.r3{animation-delay:.5s}.r4{animation-delay:.7s}
.bar{animation:bar 4s ease-in-out infinite}
.typed{animation:type 12s ease-in-out infinite}
.caret{animation:caret 12s ease-in-out infinite, blink 1s steps(1) infinite}
.grow{animation:grow 9s ease-in-out infinite}
.win{animation:win 6s ease-in-out infinite}
.cur{animation:blink 1s steps(1) infinite}
</style>
<defs>
  <clipPath id="frame"><rect width="1200" height="300" rx="14"/></clipPath>
  <clipPath id="typeclip"><rect class="fb o-l typed" x="60" y="238" width="380" height="24"/></clipPath>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1d6fdc" stop-opacity="0.26"/>
    <stop offset="1" stop-color="#0891b2" stop-opacity="0.06"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1d6fdc"/><stop offset="1" stop-color="#0891b2"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0891b2" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#0891b2" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orbA"><stop offset="0" stop-color="#1d6fdc" stop-opacity="0.38"/><stop offset="1" stop-color="#1d6fdc" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbB"><stop offset="0" stop-color="#0891b2" stop-opacity="0.30"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#cfdcec" stroke-width="1" opacity="0.6"/>
  </pattern>
</defs>
<rect width="1200" height="300" rx="14" fill="#ffffff"/>
<g clip-path="url(#frame)">
  <rect class="grid" x="-40" y="-40" width="1280" height="380" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#g)"/>
  <circle class="orbA" cx="1010" cy="60" r="170" fill="url(#orbA)"/>
  <circle class="orbB" cx="220" cy="300" r="150" fill="url(#orbB)"/>
  <rect class="sweep" x="0" y="0" width="240" height="300" fill="url(#shine)"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="299" rx="13.5" fill="none" stroke="#cfdcec"/>
<g>
  <rect class="fb o-l bar" x="60" y="66" width="56" height="4" rx="2" fill="url(#line)"/>
  <text class="r1" x="60" y="118" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="2" fill="#1d6fdc">PORTAFOLIO DE DESARROLLO</text>
  <text class="r2" x="60" y="176" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="700" fill="#0f1b2d">Luciano Rodríguez López</text>
  <text class="r3" x="60" y="216" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#54637a">Desarrollador frontend · Estudiante de Programación</text>
  <g clip-path="url(#typeclip)">
    <text x="60" y="254" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="14" fill="#54637a">React · TypeScript · Electron · Tailwind CSS</text>
  </g>
  <rect class="caret" x="60" y="242" width="8" height="16" fill="#0891b2"/>
</g>
<g class="win">
  <rect x="846" y="70" width="294" height="176" rx="12" fill="#f4f8fd" stroke="#cfdcec"/>
  <circle cx="868" cy="90" r="5" fill="#54637a" opacity="0.5"/>
  <circle cx="886" cy="90" r="5" fill="#54637a" opacity="0.5"/>
  <circle cx="904" cy="90" r="5" fill="#54637a" opacity="0.5"/>
  <line x1="846.5" y1="106" x2="1139.5" y2="106" stroke="#cfdcec"/>
  <rect class="fb o-l grow" style="animation-delay:0.0s" x="878" y="118" width="150" height="8" rx="4" fill="#1d6fdc" opacity="0.9"/><rect class="fb o-l grow" style="animation-delay:0.4s" x="902" y="138" width="210" height="8" rx="4" fill="#0f1b2d" opacity="0.9"/><rect class="fb o-l grow" style="animation-delay:0.8s" x="902" y="158" width="120" height="8" rx="4" fill="#54637a" opacity="0.45"/><rect class="fb o-l grow" style="animation-delay:1.2s" x="926" y="178" width="180" height="8" rx="4" fill="#0891b2" opacity="0.9"/><rect class="fb o-l grow" style="animation-delay:1.6s" x="926" y="198" width="90" height="8" rx="4" fill="#54637a" opacity="0.45"/><rect class="fb o-l grow" style="animation-delay:2.0s" x="902" y="218" width="160" height="8" rx="4" fill="#0f1b2d" opacity="0.9"/><rect class="fb o-l grow" style="animation-delay:2.4s" x="878" y="238" width="60" height="8" rx="4" fill="#1d6fdc" opacity="0.9"/>
  <rect class="cur" x="946" y="234" width="8" height="14" fill="#0891b2"/>
</g>
</svg>