<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12" role="presentation">
<style>
.fb{transform-box:fill-box}
.o-l{transform-origin:left center}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes run{from{transform:translateX(-360px)}to{transform:translateX(1200px)}}.run{animation:run 4.5s linear infinite}</style>
<defs>
<linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#4da3ff" stop-opacity="0"/>
<stop offset="0.5" stop-color="#4da3ff" stop-opacity="0.55"/>
<stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
<stop offset="0.5" stop-color="#22d3ee" stop-opacity="1"/>
<stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
</defs>
<rect x="0" y="5" width="1200" height="2" rx="1" fill="url(#d)"/>
<rect class="run" x="0" y="4" width="360" height="4" rx="2" fill="url(#r)"/>
</svg>