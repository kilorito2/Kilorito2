<svg xmlns="http://www.w3.org/2000/svg" width="588" height="172" viewBox="0 0 588 172" role="img" aria-label="ReverseFolio">
<style>
.fb{transform-box:fill-box}
.o-l{transform-origin:left center}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes shine{0%,55%{transform:translateX(-260px)}100%{transform:translateX(900px)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
@keyframes ic{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.enter{animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:0.12s}
.shine{animation:shine 7s ease-in-out infinite;animation-delay:0.9s}
.accentbar{animation:pulse 3.2s ease-in-out infinite;animation-delay:0.4s}
.arrow{animation:nudge 1.8s ease-in-out infinite}
.glyph{animation:ic 3.4s ease-in-out infinite;animation-delay:0.3s;transform-box:fill-box}
</style>
<defs>
  <clipPath id="c"><rect x="0.5" y="0.5" width="587" height="171" rx="12"/></clipPath>
  <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4da3ff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#4da3ff" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#4da3ff" stop-opacity="0"/>
  </linearGradient>
</defs>
<g class="enter">
<rect x="0.5" y="0.5" width="587" height="171" rx="12" fill="#111a2b" stroke="#243149"/>
<g clip-path="url(#c)">
  <rect class="accentbar" x="0" y="0" width="5" height="172" fill="#4da3ff"/>
  <rect class="shine" x="0" y="0" width="200" height="172" fill="url(#s)"/>
</g>
<g class="glyph"><g transform="translate(24,24) scale(1.0)" fill="none" stroke="#4da3ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6a9 9 0 0 0-9 9V3" />
  <circle cx="18" cy="6" r="3" />
  <circle cx="6" cy="18" r="3" /></g></g>
<text x="58" y="43" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7">ReverseFolio</text>
<g class="arrow"><g transform="translate(542,22) scale(0.9166666666666666)" fill="none" stroke="#8fa0ba" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10" />
  <path d="M7 17 17 7" /></g></g>
<line x1="24" y1="62" x2="564" y2="62" stroke="#243149"/>
<text x="24" y="92" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8fa0ba">Widget y plataforma para portfolios de devs: árbol de puntos</text><text x="24" y="114" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8fa0ba">ciegos con embeds y badge SVG.</text>
<rect x="24" y="128" width="68" height="26" rx="13" fill="#172238" stroke="#243149"/><text x="58" y="145.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#e6edf7">Next.js</text><rect x="99.80000000000001" y="128" width="75" height="26" rx="13" fill="#172238" stroke="#243149"/><text x="137" y="145.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#e6edf7">Supabase</text><rect x="183.0" y="128" width="75" height="26" rx="13" fill="#172238" stroke="#243149"/><text x="221" y="145.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#e6edf7">Monorepo</text>
</g>
</svg>