<svg xmlns="http://www.w3.org/2000/svg" width="588" height="172" viewBox="0 0 588 172" role="img" aria-label="Sakana Desktop">
<style>
.fb{transform-box:fill-box}
.o-l{transform-origin:left center}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes shine{0%,55%{transform:translateX(-260px)}100%{transform:translateX(900px)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
@keyframes ic{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.enter{animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:0.00s}
.shine{animation:shine 7s ease-in-out infinite;animation-delay:0.0s}
.accentbar{animation:pulse 3.2s ease-in-out infinite;animation-delay:0.0s}
.arrow{animation:nudge 1.8s ease-in-out infinite}
.glyph{animation:ic 3.4s ease-in-out infinite;animation-delay:0.0s;transform-box:fill-box}
</style>
<defs>
  <clipPath id="c"><rect x="0.5" y="0.5" width="587" height="171" rx="12"/></clipPath>
  <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4da3ff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#4da3ff" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#4da3ff" stop-opacity="0"/>
  </linearGradient>
</defs>
<g class="enter">
<rect x="0.5" y="0.5" width="587" height="171" rx="12" fill="#111a2b" stroke="#243149"/>
<g clip-path="url(#c)">
  <rect class="accentbar" x="0" y="0" width="5" height="172" fill="#4da3ff"/>
  <rect class="shine" x="0" y="0" width="200" height="172" fill="url(#s)"/>
</g>
<g class="glyph"><g transform="translate(24,24) scale(1.0)" fill="none" stroke="#4da3ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2" />
  <line x1="8" x2="16" y1="21" y2="21" />
  <line x1="12" x2="12" y1="17" y2="21" /></g></g>
<text x="58" y="43" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7">Sakana Desktop</text>
<g class="arrow"><g transform="translate(542,22) scale(0.9166666666666666)" fill="none" stroke="#8fa0ba" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10" />
  <path d="M7 17 17 7" /></g></g>
<line x1="24" y1="62" x2="564" y2="62" stroke="#243149"/>
<text x="24" y="92" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8fa0ba">Clon de escritorio de una interfaz de chat de IA, con capa de</text><text x="24" y="114" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8fa0ba">proveedores agnóstica del backend.</text>
<rect x="24" y="128" width="75" height="26" rx="13" fill="#172238" stroke="#243149"/><text x="62" y="145.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#e6edf7">Electron</text><rect x="107.2" y="128" width="53" height="26" rx="13" fill="#172238" stroke="#243149"/><text x="134" y="145.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#e6edf7">React</text><rect x="168.2" y="128" width="90" height="26" rx="13" fill="#172238" stroke="#243149"/><text x="213" y="145.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#e6edf7">TypeScript</text>
</g>
</svg>