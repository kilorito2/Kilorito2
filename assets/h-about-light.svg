.ic{animation:pop 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
</style>
<defs><linearGradient id="u" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d6fdc"/><stop offset="1" stop-color="#0891b2"/></linearGradient></defs>
<g class="ic"><g transform="translate(2,8) scale(1.0833333333333333)" fill="none" stroke="#1d6fdc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
  <circle cx="12" cy="7" r="4" /></g></g>
